<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Mnemo</title>
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0c0a; color: #f2efe6; font: 16px/1.6 Geist, system-ui, sans-serif; }
    .card { width: min(420px, 92vw); text-align: center; border: 1px solid #2a2a25; border-radius: 18px; padding: 36px 30px; background: #141412; }
    img { width: 64px; height: 64px; border-radius: 15px; }
    h1 { font: 400 38px/1.1 "Instrument Serif", serif; margin: 16px 0 8px; } em { color: #d4ff3a; }
    p { color: #a19d90; margin: 0 0 24px; }
    button { width: 100%; display: inline-flex; justify-content: center; align-items: center; gap: 10px; border: 0; border-radius: 11px; padding: 13px;
      background: #f2efe6; color: #0c0c0a; font: 600 15px Geist, sans-serif; cursor: pointer; }
    button:disabled { opacity: .6; }
    .msg { margin-top: 16px; font-size: 14px; color: #a19d90; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="">
    <h1>Sign in to <em>Mnemo</em></h1>
    <p>Continue with Google to connect your Mnemo app.</p>
    <button id="go"><svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
    <div class="msg" id="msg"></div>
  </div>
  <form id="back" method="POST" style="display:none"><input name="state"><input name="idToken"><input name="refreshToken"></form>
  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    const q = new URLSearchParams(location.search), port = Number(q.get("port")), state = q.get("state") || "";
    const msg = (t) => (document.getElementById("msg").textContent = t);
    if (!(port > 1024 && port < 65536) || !/^[\w-]{20,}$/.test(state)) { msg("Open this page from the Mnemo app."); document.getElementById("go").disabled = true; }
    document.getElementById("go").onclick = async () => {
      if (!firebaseConfig.apiKey) { msg("Sign-in isn't set up yet."); return; }
      const V = "11.0.2";
      const [{ initializeApp }, auth] = await Promise.all([
        import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`), import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`)]);
      const a = auth.getAuth(initializeApp(firebaseConfig));
      try {
        const res = await auth.signInWithPopup(a, new auth.GoogleAuthProvider());
        msg("Connecting to the Mnemo app…");
        // Hand the tokens to the Mnemo app on this computer only (127.0.0.1), with the one-time state code it gave us.
        const f = document.getElementById("back");
        f.action = `http://127.0.0.1:${port}/auth/callback`;
        f.state.value = state; f.idToken.value = await res.user.getIdToken(); f.refreshToken.value = res.user.refreshToken;
        f.submit();
      } catch (e) { if (e.code !== "auth/popup-closed-by-user") msg("Sign-in failed: " + (e.code || e.message)); }
    };
  </script>
</body>
</html>
